<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=1280"/>
<title>Desktop Start (Flying)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:800px;background:#0b0d1a;color:#fff;font-family:'Inter',system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
.tb{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid rgba(255,255,255,0.12);background:linear-gradient(to right,rgba(11,13,26,0.95),rgba(20,24,51,0.95))}
.logo{font-size:18px;font-weight:900;letter-spacing:0.1em;color:#f5a623;text-shadow:0 0 20px rgba(245,166,35,0.3)}
.mute{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center}
.ct{max-width:960px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.az{position:relative;width:100%;height:280px;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,0.12);background:linear-gradient(180deg,#0f1129 0%,#1a1040 40%,#0b0d1a 100%);box-shadow:0 4px 24px rgba(0,0,0,0.3)}
.neb{position:absolute;width:250px;height:250px;top:10%;right:5%;background:radial-gradient(circle,rgba(124,58,237,0.3) 0%,transparent 70%);filter:blur(40px);opacity:0.3}
.st{position:absolute;border-radius:50%;background:white}
.bf{position:absolute;bottom:0;left:0;right:0;height:48px;background:linear-gradient(to top,#0b0d1a,transparent)}
.ss{position:absolute;height:1px;border-radius:9999px;background:linear-gradient(to right,rgba(255,255,255,0.8),rgba(200,200,255,0.4),transparent);box-shadow:0 0 4px rgba(200,200,255,0.5)}
/* Multiplier top-right */
.mult{position:absolute;top:12%;right:8%;z-index:10;font-size:64px;font-weight:900;color:#f5a623;text-shadow:0 0 40px rgba(245,166,35,0.5),0 0 80px rgba(245,166,35,0.2);line-height:1}
.mult-x{font-size:40px;font-weight:700;opacity:0.8}
/* Rocket mid-flight position */
.rk{position:absolute;bottom:40%;left:35%;width:65px;filter:drop-shadow(0 0 15px rgba(255,107,53,0.4));transform:rotate(75deg)}
.bb{display:flex;align-items:center;gap:16px;padding:4px}
.bi{flex:1;display:flex;align-items:center;justify-content:space-between}
.blt{font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:0.1em;font-weight:600}
.bv{font-size:16px;font-weight:700;color:#fbbf24;text-shadow:0 0 8px rgba(251,191,36,0.3)}
.rb{flex:1;height:40px;border-radius:12px;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:0.1em;display:flex;align-items:center;justify-content:center;gap:8px;border:none;background:rgba(245,166,35,0.2);color:rgba(0,0,0,0.3)}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pn{border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;border:1px solid rgba(255,255,255,0.12);background:linear-gradient(135deg,rgba(20,24,51,0.85) 0%,rgba(25,30,60,0.85) 100%);backdrop-filter:blur(16px);box-shadow:0 4px 24px rgba(0,0,0,0.3)}
/* Panel with active bet — golden glow */
.pn-bet{border-color:rgba(245,166,35,0.3);background:linear-gradient(135deg,rgba(245,166,35,0.06) 0%,rgba(20,24,51,0.9) 100%);box-shadow:0 4px 24px rgba(0,0,0,0.3),0 0 12px rgba(245,166,35,0.15)}
.ph{display:flex;align-items:center;justify-content:space-between}
.pt{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.15em;color:#94a3b8}
.pr{display:flex;align-items:center;gap:6px}
.plf{flex:1;display:flex;align-items:center;gap:4px}
.sp{width:1px;height:20px;background:rgba(255,255,255,0.12);flex-shrink:0}
.pm{width:24px;height:28px;border-radius:4px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:white;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ai{flex:1;min-width:0;height:28px;border-radius:4px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:white;text-align:center;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
.ab{height:28px;padding:0 10px;border-radius:4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;flex-shrink:0;color:rgba(200,180,255,0.8);background:rgba(124,58,237,0.25);border:1px solid rgba(124,58,237,0.4);display:flex;align-items:center;justify-content:center}
.av{flex:1;min-width:0;height:28px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:rgba(124,58,237,0.4);background:rgba(124,58,237,0.06);border:1px solid rgba(124,58,237,0.15)}
/* CASHOUT button — green gradient */
.btn-co{width:100%;height:40px;border-radius:12px;border:none;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:0.1em;display:flex;align-items:center;justify-content:center;color:#000;background:linear-gradient(135deg,#22c55e 0%,#16a34a 50%,#22c55e 100%);box-shadow:0 0 20px rgba(34,197,94,0.4)}
/* Disabled BET button */
.btn{width:100%;height:40px;border-radius:12px;border:none;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:0.1em;display:flex;align-items:center;justify-content:center;color:rgba(0,0,0,0.5);background:rgba(245,166,35,0.4)}
.hs{display:flex;align-items:center;gap:8px;padding:8px 4px}
.hl{font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:0.1em;font-weight:600;white-space:nowrap}
.pill{padding:4px 10px;border-radius:9999px;font-size:12px;font-weight:700;white-space:nowrap}
.pg__{background:rgba(34,197,94,0.15);color:#22c55e}
.pgo{background:rgba(245,166,35,0.15);color:#fbbf24}
.pr__{background:rgba(239,68,68,0.15);color:#ef4444}
</style></head><body>
<div class="tb"><div class="logo">ROCKETLH</div><div class="mute"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f5a623" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></div></div>
<div class="ct">
<div class="az">
<div class="neb"></div>
<div class="st" style="width:2px;height:2px;top:12%;left:15%;opacity:0.5"></div><div class="st" style="width:1px;height:1px;top:25%;left:40%;opacity:0.3"></div><div class="st" style="width:2px;height:2px;top:8%;left:65%;opacity:0.6"></div><div class="st" style="width:1px;height:1px;top:35%;left:80%;opacity:0.4"></div><div class="st" style="width:2px;height:2px;top:50%;left:22%;opacity:0.35"></div><div class="st" style="width:1px;height:1px;top:18%;left:90%;opacity:0.5"></div><div class="st" style="width:2px;height:2px;top:60%;left:55%;opacity:0.25"></div><div class="st" style="width:1px;height:1px;top:42%;left:10%;opacity:0.45"></div>
<div class="ss" style="top:20%;left:45%;transform:rotate(-35deg);width:80px"></div>
<!-- Multiplier top-right -->
<div class="mult">2.45<span class="mult-x">x</span></div>
<!-- Rocket mid-flight -->
<div class="rk"><svg viewBox="0 0 80 180" fill="none" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="eg" cx="50%" cy="100%" r="50%"><stop offset="0%" stop-color="#ff6b35" stop-opacity="0.8"/><stop offset="40%" stop-color="#f5a623" stop-opacity="0.4"/><stop offset="100%" stop-color="#f5a623" stop-opacity="0"/></radialGradient><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#c0c8d8"/><stop offset="30%" stop-color="#e8ecf2"/><stop offset="60%" stop-color="#a8b2c4"/><stop offset="100%" stop-color="#8892a8"/></linearGradient><linearGradient id="ng" x1="50%" y1="0%" x2="50%" y2="100%"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#dc2626"/></linearGradient><linearGradient id="fg" x1="50%" y1="0%" x2="50%" y2="100%"><stop offset="0%" stop-color="#fbbf24"/><stop offset="40%" stop-color="#f5a623"/><stop offset="70%" stop-color="#ff6b35"/><stop offset="100%" stop-color="#ef4444" stop-opacity="0.3"/></linearGradient><linearGradient id="wg" x1="50%" y1="0%" x2="50%" y2="100%"><stop offset="0%" stop-color="#60a5fa"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient></defs><ellipse cx="40" cy="165" rx="25" ry="15" fill="url(#eg)"/><path d="M30 135 Q35 160 40 175 Q45 160 50 135" fill="url(#fg)" opacity="0.9"/><path d="M34 135 Q38 155 40 165 Q42 155 46 135" fill="#fef3c7" opacity="0.8"/><path d="M20 120 L30 105 L32 135 L18 140 Z" fill="#dc2626" stroke="#b91c1c" stroke-width="0.5"/><path d="M60 120 L50 105 L48 135 L62 140 Z" fill="#dc2626" stroke="#b91c1c" stroke-width="0.5"/><path d="M30 135 L30 55 Q30 30 40 10 Q50 30 50 55 L50 135 Z" fill="url(#bg)" stroke="#9ca3af" stroke-width="0.5"/><rect x="30" y="95" width="20" height="3" rx="1" fill="#f5a623" opacity="0.8"/><rect x="30" y="102" width="20" height="1.5" rx="0.5" fill="#f5a623" opacity="0.5"/><path d="M35 55 Q35 35 40 10 Q45 35 45 55 Z" fill="url(#ng)"/><circle cx="40" cy="65" r="7" fill="url(#wg)" stroke="#e8ecf2" stroke-width="1.5"/><ellipse cx="37" cy="63" rx="2.5" ry="3" fill="white" opacity="0.3"/><rect x="33" y="132" width="14" height="6" rx="1" fill="#6b7280" stroke="#4b5563" stroke-width="0.5"/></svg></div>
<div class="bf"></div>
</div>
<div class="bb"><div class="bi"><span class="blt">Available Balance</span><span class="bv">$4,800.00</span></div><div class="rb"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg> REBET</div></div>
<div class="pg">
<!-- Panel A — bet placed, CASHOUT -->
<div class="pn pn-bet"><div class="ph"><span class="pt">Panel A</span></div><div class="pr"><div class="plf"><div class="pm">−</div><div class="ai">100</div><div class="pm">+</div></div><div class="sp"></div><div class="plf"><div class="ab">Auto</div><div class="pm">−</div><div class="av">2.0x</div><div class="pm">+</div></div></div><div class="btn-co">CASHOUT $245.00</div></div>
<!-- Panel B — bet placed, CASHOUT -->
<div class="pn pn-bet"><div class="ph"><span class="pt">Panel B</span></div><div class="pr"><div class="plf"><div class="pm">−</div><div class="ai">100</div><div class="pm">+</div></div><div class="sp"></div><div class="plf"><div class="ab">Auto</div><div class="pm">−</div><div class="av">3.0x</div><div class="pm">+</div></div></div><div class="btn-co">CASHOUT $245.00</div></div>
<!-- Panel C — idle -->
<div class="pn"><div class="ph"><span class="pt">Panel C</span></div><div class="pr"><div class="plf"><div class="pm">−</div><div class="ai">100</div><div class="pm">+</div></div><div class="sp"></div><div class="plf"><div class="ab">Auto</div><div class="pm">−</div><div class="av">2.0x</div><div class="pm">+</div></div></div><div class="btn">BET</div></div>
<!-- Panel D — idle -->
<div class="pn"><div class="ph"><span class="pt">Panel D</span></div><div class="pr"><div class="plf"><div class="pm">−</div><div class="ai">100</div><div class="pm">+</div></div><div class="sp"></div><div class="plf"><div class="ab">Auto</div><div class="pm">−</div><div class="av">2.0x</div><div class="pm">+</div></div></div><div class="btn">BET</div></div>
</div>
<div class="hs"><span class="hl">History</span><span class="pill pg__">1.23x</span><span class="pill pgo">3.45x</span><span class="pill pg__">1.87x</span><span class="pill pgo">5.12x</span><span class="pill pr__">12.34x</span><span class="pill pg__">1.05x</span><span class="pill pgo">2.89x</span><span class="pill pg__">1.54x</span><span class="pill pgo">4.20x</span><span class="pill pg__">1.92x</span></div>
</div>
</body></html>
